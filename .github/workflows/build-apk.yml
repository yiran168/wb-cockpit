name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install stable Android API 36 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Static release audit
        run: python3 tools/release_audit.py

      - name: Test, lint and build installable APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Prepare final APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CuotiPrint-Android-v1.5.1-final-verified-debug.apk
          sha256sum CuotiPrint-Android-v1.5.1-final-verified-debug.apk > CuotiPrint-Android-v1.5.1-final-verified-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CuotiPrint-Android-v1.5.1-final-verified-debug
          path: |
            CuotiPrint-Android-v1.5.1-final-verified-debug.apk
            CuotiPrint-Android-v1.5.1-final-verified-debug.apk.sha256
